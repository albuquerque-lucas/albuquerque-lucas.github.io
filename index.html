<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Portfólio de Lucas Albuquerque, Desenvolvedor Full Stack com foco em PHP, Laravel, React e TypeScript."
    />
    <title>Lucas Albuquerque | Desenvolvedor Full Stack</title>
  </head>
  <body>
    <div id="root"></div>
    <script>
      ;(function (location) {
        if (location.search[1] === '/') {
          const decodedPath = location.search
            .slice(1)
            .split('&')
            .map((part) => part.replace(/~and~/g, '&'))
            .join('?')

          window.history.replaceState(
            null,
            '',
            location.pathname.slice(0, -1) + decodedPath + location.hash,
          )
        }
      })(window.location)
    </script>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
