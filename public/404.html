<!doctype html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Lucas Albuquerque | Portfólio</title>
    <script>
      const pathSegmentsToKeep = 0
      const locationSnapshot = window.location

      locationSnapshot.replace(
        locationSnapshot.protocol +
          '//' +
          locationSnapshot.hostname +
          (locationSnapshot.port ? ':' + locationSnapshot.port : '') +
          locationSnapshot.pathname
            .split('/')
            .slice(0, 1 + pathSegmentsToKeep)
            .join('/') +
          '/?/' +
          locationSnapshot.pathname
            .slice(1)
            .split('/')
            .slice(pathSegmentsToKeep)
            .join('/')
            .replace(/&/g, '~and~') +
          (locationSnapshot.search
            ? '&' + locationSnapshot.search.slice(1).replace(/&/g, '~and~')
            : '') +
          locationSnapshot.hash,
      )
    </script>
  </head>
  <body></body>
</html>
